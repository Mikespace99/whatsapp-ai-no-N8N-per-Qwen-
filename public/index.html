<!-- All'interno di <div id="view-agenda" class="view-section hidden"> -->
<div class="max-w-6xl mx-auto space-y-6">
    
    <!-- Header Agenda con Bottone Aggiungi -->
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
        <h2 class="text-2xl font-bold text-gray-800">Gestione Appuntamenti</h2>
        <button onclick="openModal()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg flex items-center gap-2 shadow-sm transition-colors">
            <span class="material-symbols-outlined text-sm">add</span> Nuovo Appuntamento
        </button>
    </div>

    <!-- Filtri (uguali a prima) -->
    <div class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm flex flex-wrap gap-4 items-end">
        <div>
            <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Dal</label>
            <input type="date" id="filter-start" class="border border-gray-300 rounded px-3 py-2 text-sm focus:ring-blue-500 focus:border-blue-500">
        </div>
        <div>
            <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Al</label>
            <input type="date" id="filter-end" class="border border-gray-300 rounded px-3 py-2 text-sm focus:ring-blue-500 focus:border-blue-500">
        </div>
        <div>
            <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Stato</label>
            <select id="filter-status" class="border border-gray-300 rounded px-3 py-2 text-sm bg-white">
                <option value="">Tutti</option>
                <option value="confirmed">Confermati</option>
                <option value="pending">In Attesa</option>
                <option value="cancelled">Cancellati</option>
            </select>
        </div>
        <button onclick="applyFilters()" class="bg-gray-800 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-gray-900 ml-auto">Filtra</button>
    </div>

    <!-- Tabella -->
    <div class="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden">
        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead class="bg-gray-50 text-xs uppercase text-gray-500 font-semibold">
                    <tr>
                        <th class="p-4">Data</th>
                        <th class="p-4">Orario</th>
                        <th class="p-4">Cliente</th>
                        <th class="p-4">Servizio</th>
                        <th class="p-4 text-center">Stato</th>
                        <th class="p-4 text-right">Azioni</th>
                    </tr>
                </thead>
                <tbody id="agenda-table-body" class="text-sm divide-y divide-gray-100">
                    <!-- Righe generate via JS -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- MODALE (Aggiungi/Modifica) - Inseriscilo alla fine del body, prima degli script -->
<div id="appointment-modal" class="fixed inset-0 z-50 hidden bg-black/50 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white rounded-xl shadow-2xl w-full max-w-md overflow-hidden transform transition-all scale-100">
        <div class="px-6 py-4 border-b border-gray-100 flex justify-between items-center bg-gray-50">
            <h3 id="modal-title" class="text-lg font-bold text-gray-800">Nuovo Appuntamento</h3>
            <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600"><span class="material-symbols-outlined">close</span></button>
        </div>
        
        <form id="appointment-form" onsubmit="handleSave(event)" class="p-6 space-y-4">
            <input type="hidden" id="app-id">
            
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-medium text-gray-700 mb-1">Data</label>
                    <input type="date" id="app-date" required class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-blue-500 focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-700 mb-1">Orario Inizio</label>
                    <input type="time" id="app-time" required class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-blue-500 focus:border-blue-500">
                </div>
            </div>

            <div>
                <label class="block text-xs font-medium text-gray-700 mb-1">Orario Fine (Opzionale)</label>
                <input type="time" id="app-end-time" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-blue-500 focus:border-blue-500">
            </div>

            <div>
                <label class="block text-xs font-medium text-gray-700 mb-1">Nome Cliente</label>
                <input type="text" id="app-name" required placeholder="Es. Mario Rossi" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-blue-500 focus:border-blue-500">
            </div>

            <div>
                <label class="block text-xs font-medium text-gray-700 mb-1">Telefono</label>
                <input type="tel" id="app-phone" required placeholder="+39..." class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-blue-500 focus:border-blue-500">
            </div>

            <div>
                <label class="block text-xs font-medium text-gray-700 mb-1">Servizio</label>
                <input type="text" id="app-service" placeholder="Es. Visita di controllo" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-blue-500 focus:border-blue-500">
            </div>

            <div>
                <label class="block text-xs font-medium text-gray-700 mb-1">Stato</label>
                <select id="app-status" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm bg-white focus:ring-blue-500 focus:border-blue-500">
                    <option value="confirmed">Confermato</option>
                    <option value="pending">In Attesa</option>
                    <option value="cancelled">Cancellato</option>
                </select>
            </div>

            <div class="pt-4 flex gap-3">
                <button type="button" onclick="closeModal()" class="flex-1 px-4 py-2 border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50 font-medium text-sm">Annulla</button>
                <button type="submit" class="flex-1 px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-medium text-sm shadow-sm">Salva</button>
            </div>
        </form>
    </div>
</div>

<script>
    // --- Logica Agenda & Modale ---
    let allAppointments = [];

    // Funzione per aprire il modale
    function openModal(appointment = null) {
        const modal = document.getElementById('appointment-modal');
        const title = document.getElementById('modal-title');
        const form = document.getElementById('appointment-form');
        
        form.reset();
        
        if (appointment) {
            // Modalità Modifica
            title.textContent = 'Modifica Appuntamento';
            document.getElementById('app-id').value = appointment.id;
            document.getElementById('app-date').value = appointment.date;
            document.getElementById('app-time').value = appointment.time; // mappato da start_time
            document.getElementById('app-end-time').value = appointment.end_time || '';
            document.getElementById('app-name').value = appointment.client_name; // mappato da name
            document.getElementById('app-phone').value = appointment.phone;
            document.getElementById('app-service').value = appointment.service || '';
            document.getElementById('app-status').value = appointment.status;
        } else {
            // Modalità Nuovo
            title.textContent = 'Nuovo Appuntamento';
            document.getElementById('app-id').value = '';
            // Imposta data odierna di default
            document.getElementById('app-date').valueAsDate = new Date();
        }
        
        modal.classList.remove('hidden');
    }

    function closeModal() {
        document.getElementById('appointment-modal').classList.add('hidden');
    }

    async function handleSave(e) {
        e.preventDefault();
        const id = document.getElementById('app-id').value;
        const payload = {
            date: document.getElementById('app-date').value,
            time: document.getElementById('app-time').value,
            end_time: document.getElementById('app-end-time').value,
            client_name: document.getElementById('app-name').value,
            phone: document.getElementById('app-phone').value,
            service: document.getElementById('app-service').value,
            status: document.getElementById('app-status').value
        };

        try {
            const url = id ? `/api/appointments/${id}` : '/api/appointments';
            const method = id ? 'PATCH' : 'POST';

            const res = await fetch(url, {
                method: method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (!res.ok) throw new Error('Errore salvataggio');
            
            closeModal();
            loadAppointments(); // Ricarica la tabella
            alert('Appuntamento salvato con successo!');
        } catch (err) {
            alert('Errore: ' + err.message);
        }
    }

    // Renderizza la tabella con colonna Azioni
    function renderAgendaTable(data) {
        const tbody = document.getElementById('agenda-table-body');
        if (data.length === 0) {
            tbody.innerHTML = `<tr><td colspan="6" class="p-8 text-center text-gray-500">Nessun appuntamento trovato.</td></tr>`;
            return;
        }

        tbody.innerHTML = data.map(app => {
            let badgeClass = app.status === 'confirmed' ? 'bg-green-100 text-green-700' : 
                             app.status === 'pending' ? 'bg-yellow-100 text-yellow-700' : 
                             'bg-red-100 text-red-700';
            let statusLabel = app.status === 'confirmed' ? 'Confermato' : app.status === 'pending' ? 'In Attesa' : 'Cancellato';

            return `
            <tr class="hover:bg-gray-50 transition-colors">
                <td class="p-4 font-medium text-gray-900">${new Date(app.date).toLocaleDateString('it-IT')}</td>
                <td class="p-4 text-gray-600">${app.time} ${app.end_time ? '- ' + app.end_time : ''}</td>
                <td class="p-4 font-semibold text-gray-800">${app.client_name}</td>
                <td class="p-4 text-gray-600">${app.service || '-'}</td>
                <td class="p-4 text-center"><span class="px-2 py-1 rounded-full text-xs font-bold uppercase ${badgeClass}">${statusLabel}</span></td>
                <td class="p-4 text-right">
                    <button onclick='editAppointment(${JSON.stringify(app).replace(/'/g, "&#39;")})' class="text-blue-600 hover:text-blue-800 p-2 rounded-full hover:bg-blue-50 transition-colors" title="Modifica">
                        <span class="material-symbols-outlined text-sm">edit</span>
                    </button>
                    <button onclick="deleteAppointment('${app.id}')" class="text-red-600 hover:text-red-800 p-2 rounded-full hover:bg-red-50 transition-colors ml-1" title="Elimina">
                        <span class="material-symbols-outlined text-sm">delete</span>
                    </button>
                </td>
            </tr>`;
        }).join('');
    }

    // Helper per passare l'oggetto al modale
    window.editAppointment = (app) => openModal(app);
    
    async function deleteAppointment(id) {
        if(!confirm('Sei sicuro di voler eliminare questo appuntamento?')) return;
        try {
            const res = await fetch(`/api/appointments/${id}`, { method: 'DELETE' });
            if(!res.ok) throw new Error('Errore eliminazione');
            loadAppointments();
        } catch(e) { alert(e.message); }
    }

    // Caricamento dati (da integrare con la tua logica esistente)
    async function loadAppointments() {
        // ... tua logica fetch esistente ...
        const res = await fetch('/api/appointments');
        allAppointments = await res.json();
        applyFilters();
    }
    
    // Avvio iniziale
    // loadAppointments(); // Assicurati di chiamarlo quando la vista Agenda diventa attiva
</script>
