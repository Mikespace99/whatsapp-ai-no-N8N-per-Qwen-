<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Booking Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Manrope:wght@500;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'], display: ['Manrope', 'sans-serif'] },
                    colors: {
                        primary: '#006194', 'primary-light': '#e6f0f5',
                        secondary: '#39b8fd', 'surface': '#f9fafb',
                        'on-surface': '#151c27', 'border': '#e5e7eb',
                        success: '#16a34a', warning: '#b45309', danger: '#b91c1c'
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #f9fafb; color: #151c27; }
        .nav-item.active { background-color: #e6f0f5; color: #006194; font-weight: 600; }
        .nav-item:hover:not(.active) { background-color: #f3f4f6; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        /* Mobile Sidebar */
        #sidebar { transition: transform 0.3s ease-in-out; }
        .sidebar-open { transform: translateX(0) !important; }
        .sidebar-closed { transform: translateX(-100%) !important; }
        @media (min-width: 768px) { #sidebar { transform: translateX(0) !important; } }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

    <!-- Overlay Mobile -->
    <div id="overlay" class="fixed inset-0 bg-black/50 z-20 hidden md:hidden glass" onclick="toggleSidebar()"></div>

    <!-- Sidebar -->
    <aside id="sidebar" class="fixed md:relative z-30 w-64 h-full bg-white border-r border-border flex flex-col sidebar-closed md:translate-x-0 shadow-lg md:shadow-none">
        <div class="h-16 flex items-center px-6 border-b border-border">
            <div class="w-8 h-8 bg-primary rounded-lg flex items-center justify-center text-white mr-3">
                <span class="material-symbols-outlined text-sm">smart_toy</span>
            </div>
            <span class="font-display font-bold text-lg text-primary">AI Booking</span>
            <button class="md:hidden ml-auto text-gray-500" onclick="toggleSidebar()"><span class="material-symbols-outlined">close</span></button>
        </div>

        <nav class="flex-1 p-4 space-y-1 overflow-y-auto">
            <button onclick="navigate('dashboard')" id="nav-dashboard" class="nav-item w-full flex items-center gap-3 px-3 py-3 rounded-lg text-gray-600 transition-colors">
                <span class="material-symbols-outlined">dashboard</span> Dashboard
            </button>
            <button onclick="navigate('agenda')" id="nav-agenda" class="nav-item w-full flex items-center gap-3 px-3 py-3 rounded-lg text-gray-600 transition-colors">
                <span class="material-symbols-outlined">calendar_month</span> Agenda
            </button>
            <button onclick="navigate('configurazione')" id="nav-configurazione" class="nav-item w-full flex items-center gap-3 px-3 py-3 rounded-lg text-gray-600 transition-colors">
                <span class="material-symbols-outlined">settings</span> Configurazione
            </button>
            <button onclick="navigate('statistiche')" id="nav-statistiche" class="nav-item w-full flex items-center gap-3 px-3 py-3 rounded-lg text-gray-600 transition-colors">
                <span class="material-symbols-outlined">analytics</span> Statistiche
            </button>
        </nav>

        <div class="p-4 border-t border-border">
            <a href="/" class="flex items-center gap-3 px-3 py-2 text-danger hover:bg-red-50 rounded-lg transition-colors">
                <span class="material-symbols-outlined">logout</span> Esci
            </a>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col h-full overflow-hidden relative">
        <!-- Topbar -->
        <header class="h-16 bg-white border-b border-border flex items-center justify-between px-4 md:px-8 shrink-0">
            <div class="flex items-center gap-4">
                <button class="md:hidden text-gray-600" onclick="toggleSidebar()"><span class="material-symbols-outlined">menu</span></button>
                <h1 id="page-title" class="font-display font-bold text-xl text-on-surface">Dashboard</h1>
            </div>
            <div class="flex items-center gap-3">
                <div class="text-right hidden sm:block">
                    <p class="text-sm font-semibold text-on-surface">Dott. Rossi</p>
                    <p class="text-xs text-gray-500">Admin</p>
                </div>
                <div class="w-9 h-9 rounded-full bg-primary-light text-primary flex items-center justify-center font-bold text-sm">DR</div>
            </div>
        </header>

        <!-- Dynamic Content Area -->
        <div id="content-area" class="flex-1 overflow-y-auto p-4 md:p-8">
            <!-- Content injected via JS -->
        </div>
    </main>

    <script>
        // --- STATE & DATA ---
        let appointments = [];
        let settings = {};
        const today = new Date();

        // --- NAVIGATION ---
        function toggleSidebar() {
            const sb = document.getElementById('sidebar');
            const ov = document.getElementById('overlay');
            if (sb.classList.contains('sidebar-closed')) {
                sb.classList.remove('sidebar-closed'); sb.classList.add('sidebar-open');
                ov.classList.remove('hidden');
            } else {
                sb.classList.remove('sidebar-open'); sb.classList.add('sidebar-closed');
                ov.classList.add('hidden');
            }
        }

        function navigate(page) {
            // Update Title
            const titles = { dashboard: 'Dashboard', agenda: 'Agenda', configurazione: 'Configurazione', statistiche: 'Statistiche' };
            document.getElementById('page-title').textContent = titles[page] || 'Dashboard';
            
            // Update Active Nav
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            const activeNav = document.getElementById(`nav-${page}`);
            if(activeNav) activeNav.classList.add('active');

            // Close mobile sidebar if open
            if(window.innerWidth < 768) toggleSidebar();

            // Render Content
            const content = document.getElementById('content-area');
            content.innerHTML = '<div class="flex justify-center p-8"><span class="material-symbols-outlined animate-spin text-primary">progress_activity</span></div>';
            
            setTimeout(() => {
                if (page === 'dashboard') renderDashboard(content);
                else if (page === 'agenda') renderAgenda(content);
                else if (page === 'configurazione') renderConfigurazione(content);
                else if (page === 'statistiche') renderStatistiche(content);
            }, 50);
        }

        // --- DATA FETCHING ---
        async function fetchData() {
            try {
                const [appRes, setRes] = await Promise.all([
                    fetch('/api/appointments'),
                    fetch('/api/settings')
                ]);
                appointments = await appRes.json();
                settings = await setRes.json();
            } catch (e) { console.error("Fetch error", e); }
        }

        // --- RENDERERS ---
        
        function renderDashboard(container) {
            container.innerHTML = `
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 fade-in">
                    <!-- Calendar Widget -->
                    <div class="bg-white p-6 rounded-xl border border-border shadow-sm">
                        <div class="flex justify-between items-center mb-4">
                            <h3 class="font-display font-bold text-lg" id="cal-month-year"></h3>
                            <div class="flex gap-1">
                                <button onclick="changeMonth(-1)" class="p-1 hover:bg-gray-100 rounded"><span class="material-symbols-outlined text-sm">chevron_left</span></button>
                                <button onclick="changeMonth(1)" class="p-1 hover:bg-gray-100 rounded"><span class="material-symbols-outlined text-sm">chevron_right</span></button>
                            </div>
                        </div>
                        <div class="grid grid-cols-7 text-center text-xs font-medium text-gray-500 mb-2"><div>Lun</div><div>Mar</div><div>Mer</div><div>Gio</div><div>Ven</div><div>Sab</div><div>Dom</div></div>
                        <div id="cal-grid" class="grid grid-cols-7 gap-1 text-center text-sm"></div>
                    </div>

                    <!-- Stats & List -->
                    <div class="lg:col-span-2 space-y-6">
                        <div class="grid grid-cols-3 gap-4">
                            <div class="bg-white p-4 rounded-xl border border-border shadow-sm">
                                <p class="text-xs text-gray-500 uppercase">Totale Oggi</p>
                                <p class="text-2xl font-bold text-primary" id="stat-total">0</p>
                            </div>
                            <div class="bg-white p-4 rounded-xl border border-border shadow-sm">
                                <p class="text-xs text-gray-500 uppercase">Confermati</p>
                                <p class="text-2xl font-bold text-success" id="stat-conf">0</p>
                            </div>
                            <div class="bg-white p-4 rounded-xl border border-border shadow-sm">
                                <p class="text-xs text-gray-500 uppercase">In Attesa</p>
                                <p class="text-2xl font-bold text-warning" id="stat-pend">0</p>
                            </div>
                        </div>
                        
                        <div class="bg-white rounded-xl border border-border shadow-sm overflow-hidden">
                            <div class="p-4 border-b border-border flex justify-between items-center bg-gray-50">
                                <h3 class="font-bold text-gray-700">Appuntamenti del <span id="sel-date-txt"></span></h3>
                            </div>
                            <div class="overflow-x-auto">
                                <table class="w-full text-left text-sm">
                                    <thead class="bg-gray-50 text-xs uppercase text-gray-500 font-semibold">
                                        <tr><th class="p-4">Orario</th><th class="p-4">Cliente</th><th class="p-4">Servizio</th><th class="p-4 text-center">Stato</th></tr>
                                    </thead>
                                    <tbody id="dash-table-body" class="divide-y divide-border"></tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>`;
            initCalendar();
        }

        function renderAgenda(container) {
            const rows = appointments.map(app => {
                const statusColor = app.status === 'confirmed' ? 'text-success bg-green-50' : (app.status === 'pending' ? 'text-warning bg-yellow-50' : 'text-danger bg-red-50');
                const statusLabel = app.status === 'confirmed' ? 'Confermato' : (app.status === 'pending' ? 'In Attesa' : 'Cancellato');
                return `
                <tr class="hover:bg-gray-50 transition-colors">
                    <td class="p-4 font-medium">${new Date(app.date).toLocaleDateString('it-IT')}</td>
                    <td class="p-4">${app.start_time}</td>
                    <td class="p-4 font-semibold">${app.name || 'Cliente'}</td>
                    <td class="p-4 text-gray-600">${app.service || '-'}</td>
                    <td class="p-4 text-center"><span class="px-2 py-1 rounded text-xs font-bold uppercase ${statusColor}">${statusLabel}</span></td>
                </tr>`;
            }).join('');

            container.innerHTML = `
                <div class="bg-white rounded-xl border border-border shadow-sm overflow-hidden fade-in">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-sm">
                            <thead class="bg-gray-50 text-xs uppercase text-gray-500 font-semibold">
                                <tr><th class="p-4">Data</th><th class="p-4">Ora</th><th class="p-4">Cliente</th><th class="p-4">Servizio</th><th class="p-4 text-center">Stato</th></tr>
                            </thead>
                            <tbody class="divide-y divide-border">${rows || '<tr><td colspan="5" class="p-8 text-center">Nessun appuntamento</td></tr>'}</tbody>
                        </table>
                    </div>
                </div>`;
        }

        function renderConfigurazione(container) {
            const days = ['Lunedì', 'Martedì', 'Mercoledì', 'Giovedì', 'Venerdì', 'Sabato', 'Domenica'];
            const hours = settings.working_hours || {};
            
            const rows = days.map((day, idx) => {
                const key = idx.toString();
                const active = hours[key]?.active ?? (idx < 5);
                const start = hours[key]?.start || "09:00";
                const end = hours[key]?.end || "18:00";
                return `
                <div class="flex flex-col sm:flex-row items-center justify-between p-4 bg-gray-50 rounded-lg border border-border gap-4">
                    <div class="flex items-center gap-3 w-full sm:w-auto">
                        <label class="relative inline-flex items-center cursor-pointer">
                            <input type="checkbox" id="cfg-active-${key}" class="sr-only peer" ${active ? 'checked' : ''}>
                            <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary"></div>
                        </label>
                        <span class="font-medium text-gray-700">${day}</span>
                    </div>
                    <div class="flex items-center gap-2 ${!active ? 'opacity-50 pointer-events-none' : ''}">
                        <input type="time" id="cfg-start-${key}" value="${start}" class="border border-border rounded px-2 py-1 text-sm">
                        <span class="text-gray-400">-</span>
                        <input type="time" id="cfg-end-${key}" value="${end}" class="border border-border rounded px-2 py-1 text-sm">
                    </div>
                </div>`;
            }).join('');

            container.innerHTML = `
                <div class="max-w-3xl space-y-6 fade-in">
                    <div class="bg-white p-6 rounded-xl border border-border shadow-sm">
                        <h2 class="font-display font-bold text-lg mb-4 flex items-center gap-2"><span class="material-symbols-outlined text-primary">schedule</span> Orari Lavorativi</h2>
                        <div class="space-y-3">${rows}</div>
                        <button onclick="saveConfig()" class="mt-6 w-full bg-primary text-white py-2 rounded-lg font-medium hover:bg-opacity-90 flex justify-center items-center gap-2">
                            <span class="material-symbols-outlined text-sm">save</span> Salva Modifiche
                        </button>
                    </div>
                </div>`;
        }

        function renderStatistiche(container) {
            const total = appointments.length;
            const confirmed = appointments.filter(a => a.status === 'confirmed').length;
            const rate = total ? Math.round((confirmed/total)*100) : 0;
            
            container.innerHTML = `
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 fade-in">
                    <div class="bg-white p-6 rounded-xl border border-border shadow-sm flex items-center gap-4">
                        <div class="w-12 h-12 rounded-full bg-blue-100 text-primary flex items-center justify-center"><span class="material-symbols-outlined">event</span></div>
                        <div><p class="text-sm text-gray-500">Totale App.</p><p class="text-2xl font-bold">${total}</p></div>
                    </div>
                    <div class="bg-white p-6 rounded-xl border border-border shadow-sm flex items-center gap-4">
                        <div class="w-12 h-12 rounded-full bg-green-100 text-success flex items-center justify-center"><span class="material-symbols-outlined">check_circle</span></div>
                        <div><p class="text-sm text-gray-500">Tasso Conferma</p><p class="text-2xl font-bold">${rate}%</p></div>
                    </div>
                    <div class="bg-white p-6 rounded-xl border border-border shadow-sm flex items-center gap-4">
                        <div class="w-12 h-12 rounded-full bg-orange-100 text-warning flex items-center justify-center"><span class="material-symbols-outlined">pending</span></div>
                        <div><p class="text-sm text-gray-500">In Attesa</p><p class="text-2xl font-bold">${appointments.filter(a=>a.status==='pending').length}</p></div>
                    </div>
                </div>`;
        }

        // --- LOGIC HELPERS ---
        let currentCalDate = new Date();
        let selectedCalDate = new Date();

        function changeMonth(delta) {
            currentCalDate.setMonth(currentCalDate.getMonth() + delta);
            initCalendar();
        }

        function initCalendar() {
            const grid = document.getElementById('cal-grid');
            const label = document.getElementById('cal-month-year');
            if(!grid) return;

            const y = currentCalDate.getFullYear();
            const m = currentCalDate.getMonth();
            label.textContent = new Intl.DateTimeFormat('it-IT', { month: 'long', year: 'numeric' }).format(currentCalDate);
            
            grid.innerHTML = '';
            const firstDay = new Date(y, m, 1).getDay(); // 0=Sun
            const offset = firstDay === 0 ? 6 : firstDay - 1; // Make Monday 0
            const daysInMonth = new Date(y, m + 1, 0).getDate();

            for(let i=0; i<offset; i++) grid.innerHTML += '<div></div>';
            
            for(let d=1; d<=daysInMonth; d++) {
                const dateStr = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                const isToday = new Date().toISOString().split('T')[0] === dateStr;
                const isSelected = selectedCalDate.toISOString().split('T')[0] === dateStr;
                
                let cls = "h-8 flex items-center justify-center rounded-lg cursor-pointer ";
                if(isSelected) cls += "bg-primary text-white font-bold shadow ";
                else if(isToday) cls += "bg-primary-light text-primary font-bold border border-primary ";
                else cls += "hover:bg-gray-100 text-gray-700 ";

                grid.innerHTML += `<div class="${cls}" onclick="selectDay('${dateStr}')">${d}</div>`;
            }
            updateDashData();
        }

        function selectDay(dateStr) {
            selectedCalDate = new Date(dateStr + 'T12:00:00'); // Fix timezone drift
            initCalendar();
        }

        function updateDashData() {
            const dateStr = selectedCalDate.toISOString().split('T')[0];
            document.getElementById('sel-date-txt').textContent = selectedCalDate.toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long' });
            
            const daysApps = appointments.filter(a => a.date.startsWith(dateStr)).sort((a,b) => a.start_time.localeCompare(b.start_time));
            
            document.getElementById('stat-total').textContent = daysApps.length;
            document.getElementById('stat-conf').textContent = daysApps.filter(a => a.status === 'confirmed').length;
            document.getElementById('stat-pend').textContent = daysApps.filter(a => a.status === 'pending').length;

            const tbody = document.getElementById('dash-table-body');
            if(daysApps.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="p-8 text-center text-gray-500">Nessun appuntamento</td></tr>';
            } else {
                tbody.innerHTML = daysApps.map(a => `
                    <tr class="hover:bg-gray-50 border-b last:border-0">
                        <td class="p-4 font-medium text-gray-900">${a.start_time}</td>
                        <td class="p-4 text-gray-700">${a.name || 'Cliente'}</td>
                        <td class="p-4 text-gray-600">${a.service || '-'}</td>
                        <td class="p-4 text-center">
                            <span class="px-2 py-1 rounded text-xs font-bold uppercase ${a.status === 'confirmed' ? 'bg-green-100 text-success' : 'bg-yellow-100 text-warning'}">
                                ${a.status === 'confirmed' ? 'Confermato' : 'In Attesa'}
                            </span>
                        </td>
                    </tr>
                `).join('');
            }
        }

        async function saveConfig() {
            alert("Funzione di salvataggio simulata per demo. Implementare logica API reale.");
            // Qui andrebbe la chiamata fetch('/api/settings', ...) come nel codice precedente
        }

        // --- INIT ---
        fetchData().then(() => navigate('dashboard'));
    </script>
</body>
</html>
