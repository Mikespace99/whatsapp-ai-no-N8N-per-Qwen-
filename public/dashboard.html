<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - AI Booking</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined&family=Inter:wght@400;600&family=Manrope:wght@600;700&display=swap" rel="stylesheet"/>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f9fafb; color: #151c27; }
        h1, h2, h3 { font-family: 'Manrope', sans-serif; }
        .material-symbols-outlined { vertical-align: middle; font-size: 20px; }
        /* Sidebar fissa su desktop, nascosta su mobile di default */
        .sidebar { display: none; }
        @media (min-width: 768px) { .sidebar { display: flex; } }
        .mobile-menu-open { display: flex !important; }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

    <!-- SIDEBAR -->
    <aside id="sidebar" class="sidebar flex-col w-64 bg-white border-r border-gray-200 h-full fixed md:relative z-50 transition-transform transform -translate-x-full md:translate-x-0">
        <div class="h-16 flex items-center justify-between px-6 border-b border-gray-200">
            <div class="flex items-center gap-2 text-blue-600 font-bold text-xl">
                <span class="material-symbols-outlined">smart_toy</span> AI Booking
            </div>
            <!-- Pulsante chiudi solo per mobile -->
            <button onclick="toggleMenu()" class="md:hidden text-gray-500"><span class="material-symbols-outlined">close</span></button>
        </div>
        <nav class="flex-1 p-4 space-y-2 overflow-y-auto">
            <a href="/dashboard" class="flex items-center gap-3 px-4 py-3 bg-blue-50 text-blue-700 rounded-lg font-semibold">
                <span class="material-symbols-outlined">dashboard</span> Dashboard
            </a>
            <a href="/agenda" class="flex items-center gap-3 px-4 py-3 text-gray-600 hover:bg-gray-50 rounded-lg font-medium">
                <span class="material-symbols-outlined">calendar_month</span> Agenda
            </a>
            <a href="/configurazione" class="flex items-center gap-3 px-4 py-3 text-gray-600 hover:bg-gray-50 rounded-lg font-medium">
                <span class="material-symbols-outlined">settings</span> Configurazione
            </a>
            <a href="/statistiche" class="flex items-center gap-3 px-4 py-3 text-gray-600 hover:bg-gray-50 rounded-lg font-medium">
                <span class="material-symbols-outlined">analytics</span> Statistiche
            </a>
        </nav>
        <div class="p-4 border-t border-gray-200">
            <a href="/" class="flex items-center gap-3 px-4 py-3 text-red-600 hover:bg-red-50 rounded-lg font-medium">
                <span class="material-symbols-outlined">logout</span> Esci
            </a>
        </div>
    </aside>

    <!-- Overlay Mobile -->
    <div id="overlay" onclick="toggleMenu()" class="fixed inset-0 bg-black/50 z-40 hidden md:hidden glass"></div>

    <!-- MAIN CONTENT -->
    <main class="flex-1 flex flex-col h-full overflow-hidden relative">
        <!-- Topbar -->
        <header class="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-4 md:px-8 shrink-0">
            <div class="flex items-center gap-4">
                <button onclick="toggleMenu()" class="md:hidden text-gray-600"><span class="material-symbols-outlined">menu</span></button>
                <h1 class="text-xl font-bold text-gray-900">Benvenuto, Dottore</h1>
            </div>
            <div class="w-10 h-10 rounded-full bg-blue-100 text-blue-700 flex items-center justify-center font-bold">DR</div>
        </header>

        <!-- Scrollable Area -->
        <div class="flex-1 overflow-y-auto p-4 md:p-8">
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                
                <!-- Calendario -->
                <div class="lg:col-span-1 bg-white p-6 rounded-xl border border-gray-200 shadow-sm">
                    <div class="flex justify-between items-center mb-4">
                        <h3 id="month-year" class="font-bold text-lg capitalize"></h3>
                        <div class="flex gap-2">
                            <button onclick="changeMonth(-1)" class="p-1 hover:bg-gray-100 rounded"><span class="material-symbols-outlined">chevron_left</span></button>
                            <button onclick="changeMonth(1)" class="p-1 hover:bg-gray-100 rounded"><span class="material-symbols-outlined">chevron_right</span></button>
                        </div>
                    </div>
                    <div class="grid grid-cols-7 text-center text-xs font-semibold text-gray-500 mb-2">
                        <div>Lun</div><div>Mar</div><div>Mer</div><div>Gio</div><div>Ven</div><div>Sab</div><div>Dom</div>
                    </div>
                    <div id="calendar-grid" class="grid grid-cols-7 gap-1 text-center text-sm"></div>
                </div>

                <!-- Tabella Appuntamenti -->
                <div class="lg:col-span-2 bg-white rounded-xl border border-gray-200 shadow-sm flex flex-col">
                    <div class="p-4 border-b border-gray-200 flex justify-between items-center">
                        <h3 class="font-bold text-lg">Appuntamenti del <span id="selected-date-text" class="capitalize"></span></h3>
                    </div>
                    <div class="overflow-x-auto flex-1">
                        <table class="w-full text-left border-collapse">
                            <thead class="bg-gray-50 text-xs uppercase text-gray-500 font-semibold">
                                <tr>
                                    <th class="p-4">Orario</th>
                                    <th class="p-4">Cliente</th>
                                    <th class="p-4">Stato</th>
                                </tr>
                            </thead>
                            <tbody id="app-table-body" class="text-sm divide-y divide-gray-100">
                                <tr><td colspan="3" class="p-4 text-center text-gray-500">Caricamento...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        // --- Variabili Globali ---
        let currentYear = new Date().getFullYear();
        let currentMonth = new Date().getMonth(); // 0-11
        let selectedDateStr = new Date().toISOString().split('T')[0]; // YYYY-MM-DD locale sicuro
        let appointments = [];

        // --- Menu Mobile ---
        function toggleMenu() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('overlay');
            if (sidebar.classList.contains('mobile-menu-open')) {
                sidebar.classList.remove('mobile-menu-open');
                overlay.classList.add('hidden');
            } else {
                sidebar.classList.add('mobile-menu-open');
                overlay.classList.remove('hidden');
            }
        }

        // --- Logica Calendario (Corretta per Fusi Orari) ---
        function renderCalendar() {
            const grid = document.getElementById('calendar-grid');
            const monthLabel = document.getElementById('month-year');
            grid.innerHTML = '';

            const firstDayOfMonth = new Date(currentYear, currentMonth, 1);
            const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
            
            // Aggiusta giorno della settimana (0=Dom -> 6, Lun=1 -> 0)
            let startDay = firstDayOfMonth.getDay(); 
            startDay = startDay === 0 ? 6 : startDay - 1;

            const monthNames = ["gennaio", "febbraio", "marzo", "aprile", "maggio", "giugno", "luglio", "agosto", "settembre", "ottobre", "novembre", "dicembre"];
            monthLabel.textContent = `${monthNames[currentMonth]} ${currentYear}`;

            // Spazi vuoti
            for (let i = 0; i < startDay; i++) grid.innerHTML += '<div></div>';

            // Giorni
            for (let d = 1; d <= daysInMonth; d++) {
                // Costruisci stringa data sicura YYYY-MM-DD senza fusi
                const dateStr = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                
                const isToday = dateStr === new Date().toISOString().split('T')[0];
                const isSelected = dateStr === selectedDateStr;
                
                let classes = "h-8 w-8 flex items-center justify-center rounded-full mx-auto cursor-pointer ";
                if (isSelected) classes += "bg-blue-600 text-white font-bold";
                else if (isToday) classes += "bg-blue-100 text-blue-700 font-bold border border-blue-600";
                else classes += "hover:bg-gray-100 text-gray-700";

                grid.innerHTML += `<div class="${classes}" onclick="selectDate('${dateStr}')">${d}</div>`;
            }
            loadAppointments();
        }

        function changeMonth(delta) {
            currentMonth += delta;
            if (currentMonth > 11) { currentMonth = 0; currentYear++; }
            if (currentMonth < 0) { currentMonth = 11; currentYear--; }
            renderCalendar();
        }

        function selectDate(dateStr) {
            selectedDateStr = dateStr;
            renderCalendar(); // Ridisegna per aggiornare selezione
            loadAppointments(); // Carica dati
        }

        // --- Caricamento Dati ---
        async function loadAppointments() {
            const tbody = document.getElementById('app-table-body');
            tbody.innerHTML = '<tr><td colspan="3" class="p-4 text-center">Caricamento...</td></tr>';
            
            // Aggiorna etichetta data
            const [y, m, d] = selectedDateStr.split('-');
            const dateObj = new Date(y, parseInt(m)-1, d);
            const options = { weekday: 'long', day: 'numeric', month: 'long' };
            document.getElementById('selected-date-text').textContent = dateObj.toLocaleDateString('it-IT', options);

            try {
                // NOTA: Qui assumiamo che le colonne si chiamino 'time' e 'client_name'.
                // Se il tuo DB ha nomi diversi, vedrai l'errore nei log.
                const res = await fetch('/api/appointments');
                if (!res.ok) throw new Error('Errore rete');
                const data = await res.json();
                
                // Filtra per la data selezionata
                // Assicurati che nel DB la colonna data si chiami 'date'
                const filtered = data.filter(app => app.date === selectedDateStr);

                if (filtered.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="3" class="p-4 text-center text-gray-500">Nessun appuntamento.</td></tr>';
                    return;
                }

                tbody.innerHTML = filtered.map(app => {
                    // GESTIONE NOMI COLONNE DINAMICI
                    // Se 'time' non esiste, prova 'appointment_time' o usa '--:--'
                    const timeVal = app.time || app.appointment_time || '--:--';
                    const nameVal = app.client_name || app.name || app.patient_name || 'Cliente';
                    const statusVal = app.status || 'pending';
                    
                    let statusClass = statusVal === 'confirmed' ? 'bg-green-100 text-green-700' : 
                                      statusVal === 'cancelled' ? 'bg-red-100 text-red-700' : 'bg-yellow-100 text-yellow-700';
                    let statusText = statusVal === 'confirmed' ? 'Confermato' : statusVal === 'cancelled' ? 'Cancellato' : 'In Attesa';

                    return `
                    <tr class="hover:bg-gray-50">
                        <td class="p-4 font-medium">${timeVal}</td>
                        <td class="p-4 font-semibold text-gray-900">${nameVal}</td>
                        <td class="p-4"><span class="px-2 py-1 rounded text-xs font-bold uppercase ${statusClass}">${statusText}</span></td>
                    </tr>`;
                }).join('');

            } catch (err) {
                console.error(err);
                tbody.innerHTML = `<tr><td colspan="3" class="p-4 text-center text-red-600">Errore: ${err.message}. Controlla i nomi delle colonne nel DB!</td></tr>`;
            }
        }

        // Init
        renderCalendar();
    </script>
</body>
</html>
