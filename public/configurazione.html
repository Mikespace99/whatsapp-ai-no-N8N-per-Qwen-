<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurazione - AI Booking</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700&display=swap" rel="stylesheet"/>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        "surface-page": "#f9fafb", "primary": "#006194", "on-primary": "#ffffff",
                        "surface-card": "#ffffff", "outline-variant": "#e5e7eb", "on-surface": "#151c27",
                        "on-surface-variant": "#3f4850", "surface-container-low": "#f0f3ff", "surface-container-high": "#e2e8f8"
                    },
                    fontFamily: { body: ["Inter"], headline: ["Manrope"] }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        h1, h2, h3 { font-family: 'Manrope', sans-serif; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        #mobile-drawer { transition: transform 0.3s ease-in-out; }
        .drawer-open { transform: translateX(0) !important; }
        .drawer-closed { transform: translateX(-100%) !important; }
    </style>
</head>
<body class="bg-surface-page text-on-surface flex min-h-screen overflow-hidden">
    <div id="overlay" class="fixed inset-0 bg-black/50 z-40 hidden md:hidden" onclick="toggleDrawer()"></div>

    <aside id="mobile-drawer" class="fixed md:relative z-50 h-full w-64 bg-white border-r border-outline-variant flex flex-col drawer-closed md:translate-x-0 shadow-xl md:shadow-none">
        <div class="h-16 flex items-center px-6 border-b border-outline-variant">
            <div class="w-8 h-8 bg-primary rounded-lg flex items-center justify-center text-white mr-3"><span class="material-symbols-outlined text-sm">smart_toy</span></div>
            <span class="font-headline font-bold text-lg text-primary">AI Booking</span>
            <button class="md:hidden ml-auto text-on-surface-variant" onclick="toggleDrawer()"><span class="material-symbols-outlined">close</span></button>
        </div>
        <nav class="flex-1 p-4 space-y-1 overflow-y-auto">
            <a href="/dashboard" class="flex items-center gap-3 px-3 py-2.5 text-on-surface-variant hover:bg-surface-container-low hover:text-primary rounded-lg font-medium transition-colors"><span class="material-symbols-outlined">dashboard</span> Dashboard</a>
            <a href="/agenda" class="flex items-center gap-3 px-3 py-2.5 text-on-surface-variant hover:bg-surface-container-low hover:text-primary rounded-lg font-medium transition-colors"><span class="material-symbols-outlined">calendar_month</span> Agenda</a>
            <a href="/configurazione" class="flex items-center gap-3 px-3 py-2.5 bg-surface-container-low text-primary rounded-lg font-medium transition-colors"><span class="material-symbols-outlined">settings</span> Configurazione</a>
            <a href="/statistiche" class="flex items-center gap-3 px-3 py-2.5 text-on-surface-variant hover:bg-surface-container-low hover:text-primary rounded-lg font-medium transition-colors"><span class="material-symbols-outlined">analytics</span> Statistiche</a>
        </nav>
        <div class="p-4 border-t border-outline-variant space-y-1">
            <a href="/" class="flex items-center gap-3 px-3 py-2.5 text-error hover:bg-red-50 rounded-lg font-medium"><span class="material-symbols-outlined">logout</span> Esci</a>
        </div>
    </aside>

    <main class="flex-1 flex flex-col h-screen overflow-hidden">
        <header class="h-16 bg-white border-b border-outline-variant flex items-center justify-between px-4 md:px-8 shrink-0">
            <div class="flex items-center gap-4">
                <button class="md:hidden text-on-surface-variant" onclick="toggleDrawer()"><span class="material-symbols-outlined">menu</span></button>
                <h1 class="font-headline text-xl font-bold text-on-surface">Configurazione Studio</h1>
            </div>
            <button onclick="saveSettings()" class="bg-primary text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-opacity-90 flex items-center gap-2">
                <span class="material-symbols-outlined text-sm">save</span> Salva Modifiche
            </button>
        </header>

        <div class="flex-1 overflow-y-auto p-4 md:p-8">
            <div class="max-w-3xl mx-auto space-y-6">
                
                <!-- Orari Lavorativi -->
                <div class="bg-white rounded-xl border border-outline-variant p-6 shadow-sm">
                    <h2 class="font-headline text-lg font-bold mb-4 flex items-center gap-2">
                        <span class="material-symbols-outlined text-primary">schedule</span> Orari Lavorativi
                    </h2>
                    <p class="text-sm text-on-surface-variant mb-6">Definisci i giorni e gli orari in cui l'AI può accettare prenotazioni.</p>
                    
                    <div id="working-hours-container" class="space-y-4">
                        <!-- Generato via JS -->
                    </div>
                </div>

                <!-- Impostazioni Bot -->
                <div class="bg-white rounded-xl border border-outline-variant p-6 shadow-sm">
                    <h2 class="font-headline text-lg font-bold mb-4 flex items-center gap-2">
                        <span class="material-symbols-outlined text-primary">chat</span> Messaggi Bot
                    </h2>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-on-surface mb-1">Messaggio di Benvenuto</label>
                            <textarea id="msg-welcome" rows="3" class="w-full border border-outline-variant rounded-lg p-3 text-sm focus:ring-primary focus:border-primary" placeholder="Ciao! Come posso aiutarti a prenotare?"></textarea>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-on-surface mb-1">Messaggio di Conferma</label>
                            <textarea id="msg-confirm" rows="3" class="w-full border border-outline-variant rounded-lg p-3 text-sm focus:ring-primary focus:border-primary" placeholder="Il tuo appuntamento è confermato!"></textarea>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <script>
        const days = ['Lunedì', 'Martedì', 'Mercoledì', 'Giovedì', 'Venerdì', 'Sabato', 'Domenica'];
        let settingsData = {};

        function toggleDrawer() {
            const drawer = document.getElementById('mobile-drawer');
            const overlay = document.getElementById('overlay');
            if (drawer.classList.contains('drawer-closed')) {
                drawer.classList.remove('drawer-closed'); drawer.classList.add('drawer-open'); overlay.classList.remove('hidden');
            } else {
                drawer.classList.remove('drawer-open'); drawer.classList.add('drawer-closed'); overlay.classList.add('hidden');
            }
        }

        async function loadSettings() {
            try {
                const res = await fetch('/api/settings');
                settingsData = await res.json();
                renderWorkingHours();
                
                // Carica messaggi se esistono
                if(settingsData.messages) {
                    document.getElementById('msg-welcome').value = settingsData.messages.welcome || '';
                    document.getElementById('msg-confirm').value = settingsData.messages.confirm || '';
                }
            } catch (e) { console.error("Errore carico settings", e); }
        }

        function renderWorkingHours() {
            const container = document.getElementById('working-hours-container');
            const hours = settingsData.working_hours || {};
            
            container.innerHTML = days.map((day, index) => {
                const dayKey = index.toString(); // 0 = Lun, 6 = Dom
                const isActive = hours[dayKey]?.active ?? (index < 5); // Default Lun-Ven attivi
                const start = hours[dayKey]?.start || "09:00";
                const end = hours[dayKey]?.end || "18:00";

                return `
                <div class="flex flex-col sm:flex-row sm:items-center justify-between p-4 bg-surface-page rounded-lg border border-outline-variant gap-4">
                    <div class="flex items-center gap-3 min-w-[150px]">
                        <div class="relative inline-block w-10 h-6 transition duration-200 ease-in-out">
                            <input type="checkbox" id="active-${dayKey}" class="peer absolute w-full h-full opacity-0 cursor-pointer" ${isActive ? 'checked' : ''}>
                            <div class="block w-full h-full rounded-full bg-gray-300 peer-checked:bg-primary transition-colors"></div>
                            <div class="dot absolute left-1 top-1 bg-white w-4 h-4 rounded-full transition-transform peer-checked:translate-x-4"></div>
                        </div>
                        <span class="font-medium text-on-surface">${day}</span>
                    </div>
                    
                    <div class="flex items-center gap-2 ${!isActive ? 'opacity-50 pointer-events-none' : ''}">
                        <span class="text-sm text-on-surface-variant">Dalle</span>
                        <input type="time" id="start-${dayKey}" value="${start}" class="border border-outline-variant rounded px-2 py-1 text-sm">
                        <span class="text-sm text-on-surface-variant">Alle</span>
                        <input type="time" id="end-${dayKey}" value="${end}" class="border border-outline-variant rounded px-2 py-1 text-sm">
                    </div>
                </div>`;
            }).join('');
        }

        async function saveSettings() {
            const newHours = {};
            days.forEach((_, index) => {
                const dayKey = index.toString();
                const active = document.getElementById(`active-${dayKey}`).checked;
                newHours[dayKey] = {
                    active: active,
                    start: document.getElementById(`start-${dayKey}`).value,
                    end: document.getElementById(`end-${dayKey}`).value
                };
            });

            const payload = {
                working_hours: newHours,
                messages: {
                    welcome: document.getElementById('msg-welcome').value,
                    confirm: document.getElementById('msg-confirm').value
                }
            };

            try {
                const res = await fetch('/api/settings', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if(res.ok) alert('Impostazioni salvate con successo!');
                else alert('Errore nel salvataggio.');
            } catch (e) { alert('Errore di connessione'); }
        }

        loadSettings();
    </script>
</body>
</html>
