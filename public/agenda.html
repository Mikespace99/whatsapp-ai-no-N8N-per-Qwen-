<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda - AI Booking</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700&display=swap" rel="stylesheet"/>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        "surface-page": "#f9fafb", "primary": "#006194", "on-primary": "#ffffff",
                        "surface-card": "#ffffff", "outline-variant": "#e5e7eb", "on-surface": "#151c27",
                        "on-surface-variant": "#3f4850", "surface-container-low": "#f0f3ff",
                        "status-confirmed-bg": "#f0fdf4", "status-confirmed-text": "#16a34a",
                        "status-pending-bg": "#fffbeb", "status-pending-text": "#b45309",
                        "status-cancelled-bg": "#fef2f2", "status-cancelled-text": "#b91c1c"
                    },
                    fontFamily: { body: ["Inter"], headline: ["Manrope"] }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        h1, h2, h3 { font-family: 'Manrope', sans-serif; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        #mobile-drawer { transition: transform 0.3s ease-in-out; }
        .drawer-open { transform: translateX(0) !important; }
        .drawer-closed { transform: translateX(-100%) !important; }
    </style>
</head>
<body class="bg-surface-page text-on-surface flex min-h-screen overflow-hidden">
    <div id="overlay" class="fixed inset-0 bg-black/50 z-40 hidden md:hidden" onclick="toggleDrawer()"></div>

    <!-- Sidebar (Identica a dashboard) -->
    <aside id="mobile-drawer" class="fixed md:relative z-50 h-full w-64 bg-white border-r border-outline-variant flex flex-col drawer-closed md:translate-x-0 shadow-xl md:shadow-none">
        <div class="h-16 flex items-center px-6 border-b border-outline-variant">
            <div class="w-8 h-8 bg-primary rounded-lg flex items-center justify-center text-white mr-3"><span class="material-symbols-outlined text-sm">smart_toy</span></div>
            <span class="font-headline font-bold text-lg text-primary">AI Booking</span>
            <button class="md:hidden ml-auto text-on-surface-variant" onclick="toggleDrawer()"><span class="material-symbols-outlined">close</span></button>
        </div>
        <nav class="flex-1 p-4 space-y-1 overflow-y-auto">
            <a href="/dashboard" class="flex items-center gap-3 px-3 py-2.5 text-on-surface-variant hover:bg-surface-container-low hover:text-primary rounded-lg font-medium transition-colors"><span class="material-symbols-outlined">dashboard</span> Dashboard</a>
            <a href="/agenda" class="flex items-center gap-3 px-3 py-2.5 bg-surface-container-low text-primary rounded-lg font-medium transition-colors"><span class="material-symbols-outlined">calendar_month</span> Agenda</a>
            <a href="#" class="flex items-center gap-3 px-3 py-2.5 text-on-surface-variant hover:bg-surface-container-low hover:text-primary rounded-lg font-medium transition-colors"><span class="material-symbols-outlined">group</span> Clienti</a>
            <a href="/statistiche" class="flex items-center gap-3 px-3 py-2.5 text-on-surface-variant hover:bg-surface-container-low hover:text-primary rounded-lg font-medium transition-colors"><span class="material-symbols-outlined">analytics</span> Statistiche</a>
            <a href="/configurazione" class="flex items-center gap-3 px-3 py-2.5 text-on-surface-variant hover:bg-surface-container-low hover:text-primary rounded-lg font-medium transition-colors"><span class="material-symbols-outlined">settings</span> Configurazione</a>
        </nav>
        <div class="p-4 border-t border-outline-variant space-y-1">
            <a href="/" class="flex items-center gap-3 px-3 py-2.5 text-error hover:bg-red-50 rounded-lg font-medium"><span class="material-symbols-outlined">logout</span> Esci</a>
        </div>
    </aside>

    <main class="flex-1 flex flex-col h-screen overflow-hidden">
        <header class="h-16 bg-white border-b border-outline-variant flex items-center justify-between px-4 md:px-8 shrink-0">
            <div class="flex items-center gap-4">
                <button class="md:hidden text-on-surface-variant" onclick="toggleDrawer()"><span class="material-symbols-outlined">menu</span></button>
                <h1 class="font-headline text-xl font-bold text-on-surface">Agenda Completa</h1>
            </div>
        </header>

        <div class="flex-1 overflow-y-auto p-4 md:p-8">
            <div class="max-w-5xl mx-auto space-y-6">
                <!-- Filtri Rapidi -->
                <div class="flex flex-wrap gap-4 items-center justify-between bg-white p-4 rounded-xl border border-outline-variant shadow-sm">
                    <div class="flex items-center gap-2">
                        <input type="date" id="filter-start" class="border border-outline-variant rounded-lg px-3 py-2 text-sm focus:ring-primary focus:border-primary">
                        <span class="text-on-surface-variant">-</span>
                        <input type="date" id="filter-end" class="border border-outline-variant rounded-lg px-3 py-2 text-sm focus:ring-primary focus:border-primary">
                        <button onclick="applyFilters()" class="bg-primary text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-opacity-90">Filtra</button>
                    </div>
                    <div class="flex gap-2">
                         <select id="filter-status" class="border border-outline-variant rounded-lg px-3 py-2 text-sm bg-white">
                            <option value="">Tutti gli stati</option>
                            <option value="confirmed">Confermati</option>
                            <option value="pending">In attesa</option>
                            <option value="cancelled">Cancellati</option>
                        </select>
                    </div>
                </div>

                <!-- Tabella -->
                <div class="bg-white rounded-xl border border-outline-variant shadow-sm overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead class="bg-surface-page text-xs uppercase text-on-surface-variant font-semibold">
                                <tr>
                                    <th class="p-4">Data</th>
                                    <th class="p-4">Orario</th>
                                    <th class="p-4">Cliente</th>
                                    <th class="p-4">Servizio</th>
                                    <th class="p-4 text-center">Stato</th>
                                    <th class="p-4 text-right">Note</th>
                                </tr>
                            </thead>
                            <tbody id="agenda-table-body" class="text-sm divide-y divide-outline-variant">
                                <tr><td colspan="6" class="p-8 text-center">Caricamento...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        function toggleDrawer() {
            const drawer = document.getElementById('mobile-drawer');
            const overlay = document.getElementById('overlay');
            if (drawer.classList.contains('drawer-closed')) {
                drawer.classList.remove('drawer-closed'); drawer.classList.add('drawer-open'); overlay.classList.remove('hidden');
            } else {
                drawer.classList.remove('drawer-open'); drawer.classList.add('drawer-closed'); overlay.classList.add('hidden');
            }
        }

        let allAppointments = [];

        async function fetchAppointments() {
            try {
                const res = await fetch('/api/appointments');
                allAppointments = await res.json();
                applyFilters();
            } catch (e) { console.error(e); }
        }

        function applyFilters() {
            const start = document.getElementById('filter-start').value;
            const end = document.getElementById('filter-end').value;
            const status = document.getElementById('filter-status').value;
            
            const filtered = allAppointments.filter(app => {
                let match = true;
                if (start && app.date < start) match = false;
                if (end && app.date > end) match = false;
                if (status && app.status !== status) match = false;
                return match;
            });

            renderTable(filtered);
        }

        function renderTable(data) {
            const tbody = document.getElementById('agenda-table-body');
            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="p-8 text-center text-on-surface-variant">Nessun appuntamento trovato.</td></tr>`;
                return;
            }

            tbody.innerHTML = data.sort((a,b) => (a.date+a.time).localeCompare(b.date+b.time)).map(app => {
                let statusClass = app.status === 'confirmed' ? 'bg-status-confirmed-bg text-status-confirmed-text' : 
                                  app.status === 'pending' ? 'bg-status-pending-bg text-status-pending-text' : 
                                  'bg-status-cancelled-bg text-status-cancelled-text';
                let statusText = app.status === 'confirmed' ? 'Confermato' : app.status === 'pending' ? 'In Attesa' : 'Cancellato';

                return `
                <tr class="hover:bg-surface-container-low transition-colors">
                    <td class="p-4 font-medium">${new Date(app.date).toLocaleDateString('it-IT')}</td>
                    <td class="p-4">${app.time}</td>
                    <td class="p-4 font-semibold text-on-surface">${app.client_name}</td>
                    <td class="p-4 text-on-surface-variant">${app.service || '-'}</td>
                    <td class="p-4 text-center"><span class="inline-flex px-2 py-1 rounded text-xs font-bold uppercase ${statusClass}">${statusText}</span></td>
                    <td class="p-4 text-right text-xs text-on-surface-variant truncate max-w-xs">${app.notes || '-'}</td>
                </tr>`;
            }).join('');
        }

        // Set default dates (today to end of month)
        document.getElementById('filter-start').valueAsDate = new Date();
        const endOfMonth = new Date(); endOfMonth.setDate(endOfMonth.getDate() + 30);
        document.getElementById('filter-end').valueAsDate = endOfMonth;

        fetchAppointments();
    </script>
</body>
</html>
